<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.SiteName}} - 验证码登录</title>
    <style>
        /* Design tokens copied from ObsidianArc's web/src/styles/_chat.scss so
           both projects read as one system: neutral zinc surfaces, a
           monochrome primary that inverts in dark mode, fields marked by a
           fill (never an outline), and focus drawn as a ring only. Light
           values live on :root; dark values apply by system preference or
           [data-theme] on <html>. */
        :root {
            --ai-text: #1d1d1d;
            --ai-text-secondary: #5e5e5f;
            --ai-border: rgba(29, 29, 29, 0.12);
            --ai-outline-variant: rgba(29, 29, 29, 0.16);
            --ai-state-hover: rgba(24, 24, 27, 0.08);
            --ai-surface-card: #ffffff;
            --ai-surface-container: #f4f4f5;
            --ai-surface-container-low: #f8f8f9;
            --ai-surface-container-high: #ededef;
            --ai-field-bg: #e8e8eb;
            --ai-primary: #18181b;
            --ai-primary-text: #ffffff;
            --ai-primary-hover: #303033;
            --ai-badge-bg: rgba(24, 24, 27, 0.12);
            --ai-badge-text: #18181b;
            --ai-focus-shadow: rgba(24, 24, 27, 0.22);
            --ai-shadow-md: 0 8px 24px rgba(28, 27, 31, 0.14);
            --ai-danger: #b91c1c;
            --ai-success: #15803d;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --ai-text: #ededef;
                --ai-text-secondary: #b0b0b3;
                --ai-border: rgba(237, 237, 239, 0.12);
                --ai-outline-variant: rgba(237, 237, 239, 0.16);
                --ai-state-hover: rgba(255, 255, 255, 0.16);
                --ai-surface-card: #19191b;
                --ai-surface-container: #242426;
                --ai-surface-container-low: #1c1c1e;
                --ai-surface-container-high: #2e2e30;
                --ai-field-bg: #343437;
                --ai-primary: #ffffff;
                --ai-primary-text: #000000;
                --ai-primary-hover: #dfdfdf;
                --ai-badge-bg: rgba(255, 255, 255, 0.16);
                --ai-badge-text: #ffffff;
                --ai-focus-shadow: rgba(255, 255, 255, 0.28);
                --ai-shadow-md: 0 8px 28px rgba(0, 0, 0, 0.5);
                --ai-danger: #ff9a9a;
                --ai-success: #6ee7a0;
            }
        }

        :root[data-theme="dark"] {
            --ai-text: #ededef;
            --ai-text-secondary: #b0b0b3;
            --ai-border: rgba(237, 237, 239, 0.12);
            --ai-outline-variant: rgba(237, 237, 239, 0.16);
            --ai-state-hover: rgba(255, 255, 255, 0.16);
            --ai-surface-card: #19191b;
            --ai-surface-container: #242426;
            --ai-surface-container-low: #1c1c1e;
            --ai-surface-container-high: #2e2e30;
            --ai-field-bg: #343437;
            --ai-primary: #ffffff;
            --ai-primary-text: #000000;
            --ai-primary-hover: #dfdfdf;
            --ai-badge-bg: rgba(255, 255, 255, 0.16);
            --ai-badge-text: #ffffff;
            --ai-focus-shadow: rgba(255, 255, 255, 0.28);
            --ai-shadow-md: 0 8px 28px rgba(0, 0, 0, 0.5);
            --ai-danger: #ff9a9a;
            --ai-success: #6ee7a0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Microsoft YaHei", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ai-text-secondary);
            background-color: var(--ai-surface-container-low);
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }

        .bg-layer {
            position: absolute;
            inset: 0;
            background-image: url('{{.BackgroundURL}}');
            background-size: cover;
            background-position: center;
            opacity: 0.12;
            filter: blur(16px);
            z-index: 0;
            pointer-events: none;
        }

        /* 顶部极简品牌导航条 */
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 64px;
            padding: 0 36px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--ai-text);
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: -0.01em;
        }
        .nav-logo-icon {
            width: 32px;
            height: 32px;
            border-radius: 9px;
            background: var(--ai-primary);
            color: var(--ai-primary-text);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 800;
        }

        /* 主卡片容器 */
        .card-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            background: var(--ai-surface-card);
            border: 1px solid var(--ai-border);
            border-radius: 18px;
            padding: 38px 34px;
            box-shadow: var(--ai-shadow-md);
            animation: cardEntrance 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes cardEntrance {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 卡片头部 */
        .card-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .site-badge-wrapper {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--ai-badge-bg);
            color: var(--ai-badge-text);
            padding: 5px 12px;
            border-radius: 9999px;
            font-size: 0.76rem;
            font-weight: 600;
            margin-bottom: 14px;
        }
        .card-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: var(--ai-text);
            margin-bottom: 8px;
        }
        .instruction-box {
            font-size: 0.92rem;
            color: var(--ai-text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 6px;
        }
        .group-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: var(--ai-surface-container-high);
            color: var(--ai-text);
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 9999px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .group-pill:hover {
            background: var(--ai-field-bg);
        }

        /* 验证码展示区域：主色反白模块 */
        .code-display {
            background: var(--ai-primary);
            border-radius: 14px;
            padding: 26px 18px;
            text-align: center;
            margin-bottom: 22px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s;
        }
        .code-display:hover {
            transform: translateY(-2px);
            box-shadow: var(--ai-shadow-md);
        }
        .code-display:active {
            transform: scale(0.99);
        }
        .code-label-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6px 12px 6px;
            color: var(--ai-primary-text);
            opacity: 0.55;
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            border-bottom: 1px solid var(--ai-primary-text);
            margin-bottom: 16px;
        }
        .code-label-bar .code-sym {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }
        .code-text {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 2.7rem;
            font-weight: 700;
            color: var(--ai-primary-text);
            letter-spacing: 12px;
            margin-right: -12px;
            user-select: all;
            line-height: 1.1;
        }
        .copy-hint {
            margin-top: 14px;
            font-size: 0.75rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: var(--ai-primary-text);
            opacity: 0.65;
            transition: opacity 0.2s;
        }
        .code-display:hover .copy-hint {
            opacity: 1;
        }

        /* 状态与倒计时条 */
        .status-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--ai-surface-container);
            border-radius: 14px;
            padding: 14px 18px;
            font-size: 0.88rem;
        }
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: var(--ai-text);
        }
        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background-color: var(--ai-success);
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.3); }
        }
        .timer {
            font-variant-numeric: tabular-nums;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-weight: 600;
            font-size: 0.88rem;
            color: var(--ai-text-secondary);
        }
        .timer span {
            color: var(--ai-text);
            font-weight: 700;
        }

        /* 底部辅助提示说明 */
        .tips-section {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--ai-border);
            display: flex;
            align-items: flex-start;
            gap: 10px;
            color: var(--ai-text-secondary);
            font-size: 0.8rem;
            line-height: 1.5;
        }
        .tips-icon {
            font-size: 1rem;
            flex-shrink: 0;
            margin-top: 1px;
        }

        /* 成功覆盖层动画 */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .checkmark-card {
            background: var(--ai-surface-card);
            border: 1px solid var(--ai-border);
            border-radius: 18px;
            padding: 40px 48px;
            text-align: center;
            box-shadow: var(--ai-shadow-md);
            transform: scale(0.85);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .overlay.active .checkmark-card {
            transform: scale(1);
        }
        .checkmark-circle {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            color: var(--ai-success);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
        }
        .overlay-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--ai-text);
            margin-bottom: 6px;
        }
        .overlay-subtitle {
            font-size: 0.9rem;
            color: var(--ai-text-secondary);
        }

        {{.CustomCSS}}
    </style>
</head>
<body>
    {{if .BackgroundURL}}
    <div class="bg-layer"></div>
    {{end}}

    <nav class="top-nav">
        <a class="nav-brand" href="/">
            <div class="nav-logo-icon">✦</div>
            <span>{{.SiteName}}</span>
        </a>
    </nav>

    <div class="card-container">
        <div class="card-header">
            <div class="site-badge-wrapper">
                <span class="sparkle">✦</span>
                <span>OIDC 统一身份核验</span>
            </div>
            <h1>{{.SiteName}}</h1>
            <div class="instruction-box">
                <span>{{.PromptText}}</span>
                <span class="group-pill" onclick="copyGroup('{{.GroupID}}')" title="点击复制群号">
                    👥 {{.GroupID}}
                </span>
            </div>
        </div>

        <div class="code-display" onclick="copyCode()" title="点击一键复制验证码">
            <div class="code-label-bar">
                <span class="code-sym">✦ VERIFY CODE</span>
                <span class="code-sym">{ }</span>
            </div>
            <div class="code-text" id="verifyCode">{{.VerifyCode}}</div>
            <div class="copy-hint" id="copyHint">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
                <span>点击卡片一键复制</span>
            </div>
        </div>

        <div class="status-container">
            <div class="status-indicator">
                <div class="dot" id="statusDot"></div>
                <span id="statusText">等待群内验证...</span>
            </div>
            <div class="timer" id="timer">剩余: <span id="timeLeft">{{.TTL}}</span>s</div>
        </div>

        <div class="tips-section">
            <span class="tips-icon">💡</span>
            <div>请使用绑定的 {{.PlatformLabel}} 账号在目标群内直接发送上方 6 位验证码，系统将自动核验并在 1 秒内完成跳转登录。</div>
        </div>
    </div>

    <div class="overlay" id="successOverlay">
        <div class="checkmark-card">
            <div class="checkmark-circle">
                <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>
            <div class="overlay-title">核验成功</div>
            <div class="overlay-subtitle">正在安全跳转回业务应用...</div>
        </div>
    </div>

    <script>
        const ttlInit = {{.TTL}};
        let timeLeft = ttlInit;
        const timerEl = document.getElementById('timeLeft');
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');

        // 倒计时计时器
        const timerInterval = setInterval(() => {
            if (timeLeft > 0) {
                timeLeft--;
                timerEl.textContent = timeLeft;
            } else {
                clearInterval(timerInterval);
                setExpired();
            }
        }, 1000);

        function setExpired() {
            statusText.textContent = "验证码已过期";
            statusText.style.color = "var(--ai-danger)";
            statusDot.style.backgroundColor = "var(--ai-danger)";
            statusDot.style.boxShadow = "none";
            statusDot.style.animation = "none";
            const cd = document.querySelector('.code-display');
            if (cd) {
                cd.style.opacity = '0.4';
                cd.style.pointerEvents = 'none';
            }
        }

        const copyHintDefault = document.getElementById('copyHint').innerHTML;

        function copyCode() {
            const code = document.getElementById('verifyCode').innerText.trim();
            navigator.clipboard.writeText(code).then(() => {
                const hint = document.getElementById('copyHint');
                hint.innerHTML = '<span>✓ 已复制验证码到剪贴板！</span>';
                setTimeout(() => {
                    hint.innerHTML = copyHintDefault;
                }, 2000);
            }).catch(err => {
                console.error("Failed to copy code: ", err);
            });
        }

        // A transient inline hint rather than an alert: the pill is inside a
        // fixed-height card and dialogs steal focus from the code to copy.
        function copyGroup(grp) {
            navigator.clipboard.writeText(grp).then(() => {
                const pill = document.querySelector('.group-pill');
                const original = pill.innerHTML;
                pill.innerHTML = '✓ 已复制群号';
                setTimeout(() => { pill.innerHTML = original; }, 1500);
            });
        }

        // SSE 监听连接
        const sessionID = "{{.SessionID}}";
        if (sessionID) {
            const evtSource = new EventSource(`/api/session/stream?session_id=${sessionID}`);

            evtSource.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    if (data.status === 'verified') {
                        clearInterval(timerInterval);
                        showSuccess(data.redirect || data.redirect_uri);
                        evtSource.close();
                    } else if (data.status === 'expired') {
                        clearInterval(timerInterval);
                        setExpired();
                        evtSource.close();
                    }
                } catch (e) {
                    console.error("Parse SSE data error:", e);
                }
            };

            evtSource.onerror = function() {
                console.error("SSE connection error");
            };
        }

        function showSuccess(redirectUri) {
            const overlay = document.getElementById('successOverlay');
            overlay.classList.add('active');

            setTimeout(() => {
                if (redirectUri) {
                    window.location.href = redirectUri;
                } else {
                    statusText.textContent = "验证成功";
                    statusText.style.color = "var(--ai-success)";
                }
            }, 1200);
        }
    </script>
</body>
</html>
