<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.SiteName}} - 验证码登录</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #f8fafc;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --text-heading: #0f172a;
            --text-body: #475569;
            --text-muted: #94a3b8;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --code-bg: #090d16;
            --code-color: #38bdf8;
            --success: #10b981;
            --danger: #ef4444;
            --radius-card: 24px;
            --radius-inner: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-body);
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(37, 99, 235, 0.04) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(99, 102, 241, 0.04) 0%, transparent 40%),
                linear-gradient(to right, rgba(226, 232, 240, 0.4) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(226, 232, 240, 0.4) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 36px 36px, 36px 36px;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }

        .bg-layer {
            position: absolute;
            inset: 0;
            background-image: url('{{.BackgroundURL}}');
            background-size: cover;
            background-position: center;
            opacity: 0.12;
            filter: blur(16px);
            z-index: 0;
            pointer-events: none;
        }

        /* 顶部极简品牌导航条 */
        .top-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 64px;
            padding: 0 36px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-heading);
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: -0.01em;
        }
        .nav-logo-icon {
            width: 32px;
            height: 32px;
            border-radius: 9px;
            background: #0f172a;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 800;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .nav-link {
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.88rem;
            font-weight: 500;
            transition: color 0.2s;
        }
        .nav-link:hover {
            color: var(--text-heading);
        }

        /* 主卡片容器 */
        .card-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-card);
            padding: 38px 34px;
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08), 0 0 0 1px rgba(15, 23, 42, 0.03);
            animation: cardEntrance 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes cardEntrance {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 卡片头部 */
        .card-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .site-badge-wrapper {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #f1f5f9;
            border: 1px solid #e2e8f0;
            padding: 5px 12px;
            border-radius: 9999px;
            font-size: 0.76rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 14px;
        }
        .site-badge-wrapper .sparkle {
            font-size: 0.85rem;
            color: #2563eb;
        }
        .card-header h1 {
            font-size: 1.65rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--text-heading);
            margin-bottom: 8px;
        }
        .instruction-box {
            font-size: 0.92rem;
            color: var(--text-body);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 6px;
        }
        .group-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            color: #1d4ed8;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .group-pill:hover {
            background: #dbeafe;
        }

        /* 验证码展示区域：黑曜高对比度模块 */
        .code-display {
            background: var(--code-bg);
            border: 1px solid #1e293b;
            border-radius: var(--radius-inner);
            padding: 26px 18px;
            text-align: center;
            margin-bottom: 22px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.4);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .code-display:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 36px -10px rgba(0, 0, 0, 0.5);
            border-color: #38bdf8;
        }
        .code-display:active {
            transform: scale(0.99);
        }
        .code-label-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6px 12px 6px;
            color: #64748b;
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 16px;
        }
        .code-label-bar .code-sym {
            font-family: 'JetBrains Mono', monospace;
            color: #94a3b8;
        }
        .code-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 2.7rem;
            font-weight: 700;
            color: var(--code-color);
            letter-spacing: 12px;
            margin-right: -12px;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
            user-select: all;
            line-height: 1.1;
        }
        .copy-hint {
            margin-top: 14px;
            font-size: 0.75rem;
            color: #94a3b8;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: color 0.2s;
        }
        .code-display:hover .copy-hint {
            color: #e2e8f0;
        }

        /* 状态与倒计时条 */
        .status-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: var(--radius-inner);
            padding: 14px 18px;
            font-size: 0.88rem;
        }
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: var(--text-body);
        }
        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background-color: var(--primary);
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.5);
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.3); }
        }
        .timer {
            font-variant-numeric: tabular-nums;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            font-size: 0.88rem;
            color: #64748b;
        }
        .timer span {
            color: var(--text-heading);
            font-weight: 700;
        }

        /* 底部辅助提示说明 */
        .tips-section {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #f1f5f9;
            display: flex;
            align-items: flex-start;
            gap: 10px;
            color: var(--text-muted);
            font-size: 0.8rem;
            line-height: 1.5;
        }
        .tips-icon {
            font-size: 1rem;
            color: #64748b;
            flex-shrink: 0;
            margin-top: 1px;
        }

        /* 成功覆盖层动画 */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .checkmark-card {
            background: #ffffff;
            border-radius: 28px;
            padding: 40px 48px;
            text-align: center;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.3);
            transform: scale(0.85);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .overlay.active .checkmark-card {
            transform: scale(1);
        }
        .checkmark-circle {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #ecfdf5;
            color: #059669;
            border: 2px solid #a7f3d0;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.2);
        }
        .overlay-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 6px;
        }
        .overlay-subtitle {
            font-size: 0.9rem;
            color: #64748b;
        }

        {{.CustomCSS}}
    </style>
</head>
<body>
    {{if .BackgroundURL}}
    <div class="bg-layer"></div>
    {{end}}

    <nav class="top-nav">
        <a class="nav-brand" href="/">
            <div class="nav-logo-icon">✦</div>
            <span>{{.SiteName}}</span>
        </a>
    </nav>
    
    <div class="card-container">
        <div class="card-header">
            <div class="site-badge-wrapper">
                <span class="sparkle">✦</span>
                <span>OIDC 统一身份核验</span>
            </div>
            <h1>{{.SiteName}}</h1>
            <div class="instruction-box">
                <span>{{.PromptText}}</span>
                <span class="group-pill" onclick="copyGroup('{{.GroupID}}')" title="点击复制群号">
                    👥 {{.GroupID}}
                </span>
            </div>
        </div>
        
        <div class="code-display" onclick="copyCode()" title="点击一键复制验证码">
            <div class="code-label-bar">
                <span class="code-sym">✦ VERIFY CODE</span>
                <span class="code-sym">{ }</span>
            </div>
            <div class="code-text" id="verifyCode">{{.VerifyCode}}</div>
            <div class="copy-hint" id="copyHint">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
                <span>点击卡片一键复制</span>
            </div>
        </div>
        
        <div class="status-container">
            <div class="status-indicator">
                <div class="dot" id="statusDot"></div>
                <span id="statusText">等待群内验证...</span>
            </div>
            <div class="timer" id="timer">剩余: <span id="timeLeft">{{.TTL}}</span>s</div>
        </div>

        <div class="tips-section">
            <span class="tips-icon">💡</span>
            <div>请使用绑定的 QQ 号在目标群内直接发送上方 6 位验证码，系统将自动核验并在 1 秒内完成跳转登录。</div>
        </div>
    </div>
    
    <div class="overlay" id="successOverlay">
        <div class="checkmark-card">
            <div class="checkmark-circle">
                <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </div>
            <div class="overlay-title">核验成功</div>
            <div class="overlay-subtitle">正在安全跳转回业务应用...</div>
        </div>
    </div>

    <script>
        const ttlInit = {{.TTL}};
        let timeLeft = ttlInit;
        const timerEl = document.getElementById('timeLeft');
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');
        
        // 倒计时计时器
        const timerInterval = setInterval(() => {
            if (timeLeft > 0) {
                timeLeft--;
                timerEl.textContent = timeLeft;
            } else {
                clearInterval(timerInterval);
                setExpired();
            }
        }, 1000);
        
        function setExpired() {
            statusText.textContent = "验证码已过期";
            statusText.style.color = "var(--danger)";
            statusDot.style.backgroundColor = "var(--danger)";
            statusDot.style.boxShadow = "none";
            statusDot.style.animation = "none";
            const cd = document.querySelector('.code-display');
            if (cd) {
                cd.style.opacity = '0.4';
                cd.style.pointerEvents = 'none';
            }
        }
        
        function copyCode() {
            const code = document.getElementById('verifyCode').innerText.trim();
            navigator.clipboard.writeText(code).then(() => {
                const hint = document.getElementById('copyHint');
                hint.innerHTML = '<span style="color: #38bdf8;">✓ 已复制验证码到剪贴板！</span>';
                setTimeout(() => {
                    hint.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg><span>点击卡片一键复制</span>';
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy code: ', err);
            });
        }

        function copyGroup(grp) {
            navigator.clipboard.writeText(grp).then(() => {
                alert('群号 ' + grp + ' 已复制');
            });
        }
        
        // SSE 监听连接
        const sessionID = "{{.SessionID}}";
        if (sessionID) {
            const evtSource = new EventSource(`/api/session/stream?session_id=${sessionID}`);
            
            evtSource.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    if (data.status === 'verified') {
                        clearInterval(timerInterval);
                        showSuccess(data.redirect || data.redirect_uri);
                        evtSource.close();
                    } else if (data.status === 'expired') {
                        clearInterval(timerInterval);
                        setExpired();
                        evtSource.close();
                    }
                } catch (e) {
                    console.error("Parse SSE data error:", e);
                }
            };
            
            evtSource.onerror = function() {
                console.error("SSE connection error");
            };
        }
        
        function showSuccess(redirectUri) {
            const overlay = document.getElementById('successOverlay');
            overlay.classList.add('active');
            
            setTimeout(() => {
                if (redirectUri) {
                    window.location.href = redirectUri;
                } else {
                    statusText.textContent = "验证成功";
                    statusText.style.color = "var(--success)";
                }
            }, 1200);
        }
    </script>
</body>
</html>
